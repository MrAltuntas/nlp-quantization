[project]
name = "nlp-quantization"
version = "0.1.0"
description = "Impact of quantization methods on LLM performance across NLP tasks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
