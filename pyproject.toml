[project]
name = "nlp-quantization"
version = "0.1.0"
description = "Impact of quantization methods on LLM performance across NLP tasks"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pydantic>=2",
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.30",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
    "auto-gptq>=0.7; sys_platform == 'linux'",
    "autoawq>=0.2; sys_platform == 'linux'",
    "lm-eval>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
